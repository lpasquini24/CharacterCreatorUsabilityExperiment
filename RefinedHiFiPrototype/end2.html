<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>End — Experiment 2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main style="padding:24px;max-width:900px;margin:40px auto;font-family:inherit">
    <h1>Experiment 2 — Task Results</h1>
    <p>The CSV below contains accumulated runs for this prototype (one row per run). Experiment 2 does not display the error breakdown.</p>
    <section id="aggregates" style="margin-bottom:18px;background:#fff9f0;border:1px solid #f0e0d0;padding:12px;border-radius:8px;">
      <h3 style="margin:0 0 8px">Summary</h3>
      <div id="summary">(loading summary...)</div>
    </section>
    <section id="surveyAggregates" style="margin-bottom:18px;background:#f0fff7;border:1px solid #dff0e6;padding:12px;border-radius:8px;">
      <h3 style="margin:0 0 8px">Survey results</h3>
      <div id="surveySummary">(loading survey results...)</div>
    </section>
    <pre id="csv" style="white-space:pre-wrap;background:#f7f7f7;padding:12px;border-radius:8px;border:1px solid #ddd;min-height:120px"></pre>

    <div style="margin-top:18px;display:flex;gap:8px;align-items:center">
      <button id="restartBtn" class="top-btn">Restart</button>
      <button id="clearBtn" style="margin-left:12px;padding:10px 14px;border-radius:10px">Clear results (A+B)</button>
      <button id="downloadBtnA" style="margin-left:12px;padding:10px 14px;border-radius:10px">Download metrics CSV (Variant A)</button>
      <button id="downloadBtnB" style="margin-left:12px;padding:10px 14px;border-radius:10px">Download metrics CSV (Variant B)</button>
    </div>
  </main>

  <script>
    function readCsvVariant(v){ return localStorage.getItem(`prototype_metrics_csv_exp2_v${v}`) || ''; }
    function readSurveyVariant(v){ return localStorage.getItem(`prototype_survey_csv_exp2_v${v}`) || ''; }
    // Show merged CSVs (metrics + survey) for both variants
    function mergeCsvsForExp(exp, v){
      const metrics = localStorage.getItem(`prototype_metrics_csv_exp${exp}_v${v}`) || '';
      const survey = localStorage.getItem(`prototype_survey_csv_exp${exp}_v${v}`) || '';
      const mLines = metrics.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
      const sLines = survey.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
      const mHeader = mLines.length? mLines[0].split(',').map(h=>h.trim()):[];
      const sHeader = sLines.length? sLines[0].split(',').map(h=>h.trim()):[];
      const mRows = mLines.slice(1);
      const sRows = sLines.slice(1);
      // Unified header: metrics then timestamp then Q1..Q9
      const header = ['time_ms','powers_bought','powers_sold','tooltips_viewed','missing_tier2','missing_traditions','timestamp','Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9'];
      const outRows = [];
      const max = Math.max(mRows.length, sRows.length);
      for(let i=0;i<max;i++){
        const mcols = (mRows[i] || '').split(',');
        const scols = (sRows[i] || '').split(',');
        const mMap = {};
        for(let j=0;j<mHeader.length;j++) mMap[mHeader[j]] = mcols[j]===undefined? '': mcols[j];
        const sMap = {};
        for(let j=0;j<sHeader.length;j++) sMap[sHeader[j]] = scols[j]===undefined? '0': scols[j];
        const row = [];
        header.forEach(col => {
          if(col.startsWith('Q')){
            // survey keys in header might be q1..q8 or Q1..Q8; accept both
            const keyLower = 'q'+col.slice(1).toLowerCase();
            const keyUpper = 'Q'+col.slice(1);
            const val = (sMap[keyUpper] !== undefined) ? sMap[keyUpper] : ((sMap[keyLower] !== undefined) ? sMap[keyLower] : '0');
            row.push(val);
          } else {
            // metrics/timestamp
            row.push(mMap[col] !== undefined ? mMap[col] : '');
          }
        });
        outRows.push(row.join(','));
      }
      return header.join(',') + (outRows.length? '\n'+outRows.join('\n') : '\n');
    }

    const mergedA = mergeCsvsForExp(2,'A');
    const mergedB = mergeCsvsForExp(2,'B');
    const displayText = `=== Variant A (merged) ===\n${(mergedA||'(no results yet)')}\n\n=== Variant B (merged) ===\n${(mergedB||'(no results yet)')}`;
    document.getElementById('csv').textContent = displayText;

    // Compute aggregate summary from CSV (for experiment 2 we omit error columns)
    function computeSummary(csv){
      if(!csv) return null;
      const lines = csv.split('\n').map(l => l.trim()).filter(l => l.length>0);
      if(lines.length <= 1) return null; // only header
      const header = lines[0].split(',').map(h => h.trim());
      const rows = lines.slice(1);
      const idx = (name) => {
        const i = header.indexOf(name);
        return i >= 0 ? i : -1;
      };
      const time_i = idx('time_ms');
      const bought_i = idx('powers_bought');
      const sold_i = idx('powers_sold');
      const tips_i = idx('tooltips_viewed');
      let totalRuns = 0, sumTime = 0, sumBought = 0, sumSold = 0, sumTips = 0;
      rows.forEach(r => {
        const cols = r.split(',');
        if(cols.length === 0) return;
        totalRuns += 1;
        if(time_i >= 0) sumTime += parseFloat(cols[time_i]) || 0;
        if(bought_i >= 0) sumBought += parseInt(cols[bought_i]) || 0;
        if(sold_i >= 0) sumSold += parseInt(cols[sold_i]) || 0;
        if(tips_i >= 0) sumTips += parseInt(cols[tips_i]) || 0;
      });
      return { totalRuns, sumTime, avgTime: totalRuns? Math.round(sumTime/totalRuns):0, sumBought, sumSold, sumTips };
    }

    function renderSummaryForVariant(v){
      const csv = readCsvVariant(v);
      const s = computeSummary(csv);
      if(!s) return null; 
      return s;
    }

    function renderSummary(){
      const a = renderSummaryForVariant('A');
      const b = renderSummaryForVariant('B');
      const el = document.getElementById('summary');
      if(!a && !b){ el.innerHTML = '(no runs recorded yet)'; return; }
      let out = '';
      if(a){ out += `<h4 style="margin:4px 0">Variant A</h4>
        <div><strong>Total runs:</strong> ${a.totalRuns}</div>
        <div><strong>Average time on task:</strong> ${a.avgTime} ms (${(a.avgTime/1000).toFixed(2)} s)</div>
        <div><strong>Total powers bought:</strong> ${a.sumBought}</div>
        <div><strong>Total powers sold:</strong> ${a.sumSold}</div>
        <div><strong>Total tooltips viewed:</strong> ${a.sumTips}</div>`; }
      if(b){ out += `<h4 style="margin:12px 0 4px">Variant B</h4>
        <div><strong>Total runs:</strong> ${b.totalRuns}</div>
        <div><strong>Average time on task:</strong> ${b.avgTime} ms (${(b.avgTime/1000).toFixed(2)} s)</div>
        <div><strong>Total powers bought:</strong> ${b.sumBought}</div>
        <div><strong>Total powers sold:</strong> ${b.sumSold}</div>
        <div><strong>Total tooltips viewed:</strong> ${b.sumTips}</div>`; }
      el.innerHTML = out;
    }

    renderSummary();

    document.getElementById('restartBtn').addEventListener('click', function(){ window.location.href = 'start2.html'; });

    document.getElementById('clearBtn').addEventListener('click', function(){
      ['A','B'].forEach(v => { localStorage.removeItem(`prototype_metrics_csv_exp2_v${v}`); localStorage.removeItem(`prototype_survey_csv_exp2_v${v}`); });
      document.getElementById('csv').textContent = '(no results yet)';
      renderSummary();
      renderSurveySummary();
    });

    document.getElementById('downloadBtnA').addEventListener('click', function(){
      const data = mergeCsvsForExp(2,'A');
      if(!data){ alert('No data to download for Variant A'); return; }
      const blob = new Blob([data], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'merged_exp2_A.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    document.getElementById('downloadBtnB').addEventListener('click', function(){
      const data = mergeCsvsForExp(2,'B');
      if(!data){ alert('No data to download for Variant B'); return; }
      const blob = new Blob([data], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'merged_exp2_B.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    // Survey CSV utilities
    function readSurveyCsvVariant(v){ return localStorage.getItem(`prototype_survey_csv_exp2_v${v}`) || ''; }

    function computeSurveySummary(csv){
      if(!csv) return null;
      const lines = csv.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
      if(lines.length <= 1) return null;
      const header = lines[0].split(',').map(h=>h.trim());
      const rows = lines.slice(1);
      // take all question keys (everything except the trailing timestamp)
      const qKeys = header.slice(0, Math.max(0, header.length - 1));
      const sums = {};
      const counts = {};
      qKeys.forEach(k => { sums[k]=0; counts[k]=0; });
      rows.forEach(r => {
        const cols = r.split(',');
        for(let i=0;i<qKeys.length;i++){
          const v = parseFloat(cols[i]);
          if(!isNaN(v)){ sums[qKeys[i]] += v; counts[qKeys[i]] += 1; }
        }
      });
      const res = { totalResponses: rows.length, questions: {} };
      qKeys.forEach(k => {
        const c = counts[k]||0;
        res.questions[k] = { avg: c? (sums[k]/c):0, count: c };
      });
      return res;
    }

    function renderSurveySummary(){
      // Show survey summaries for Variant A and Variant B separately
      const aCsv = readSurveyCsvVariant('A');
      const bCsv = readSurveyCsvVariant('B');
      const a = computeSurveySummary(aCsv);
      const b = computeSurveySummary(bCsv);
      const el = document.getElementById('surveySummary');
      if(!a && !b){ el.innerHTML = '(no survey responses yet)'; return; }
      const labels = {
        q1: 'I am very familiar with Adept.',
        q2: 'I felt slowed down / irritated by calculations',
        q9: 'I could easily find how much EXP I had left when I needed to'
      };
      let out = '';
      if(a){ out += `<h4 style="margin:4px 0">Variant A</h4><div><strong>Total responses:</strong> ${a.totalResponses}</div>`;
        ['q1','q2','q9'].forEach((key) => { const q = a.questions[key] || { avg:0,count:0 }; out += `<div style="margin-top:6px"><strong>${labels[key]}</strong> — <strong>avg:</strong> ${q.avg.toFixed(2)} (<em>${q.count} responses</em>)</div>`; }); }
      if(b){ out += `<h4 style="margin:12px 0 4px">Variant B</h4><div><strong>Total responses:</strong> ${b.totalResponses}</div>`;
        ['q1','q2','q9'].forEach((key) => { const q = b.questions[key] || { avg:0,count:0 }; out += `<div style="margin-top:6px"><strong>${labels[key]}</strong> — <strong>avg:</strong> ${q.avg.toFixed(2)} (<em>${q.count} responses</em>)</div>`; }); }
      el.innerHTML = out;
    }

    // survey download buttons removed; no-op

    renderSurveySummary();
  </script>
</body>
</html>
